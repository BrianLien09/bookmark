name: Deploy to master

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          path: master-branch
          persist-credentials: true

      - name: Replace master contents
        shell: bash
        run: |
          rm -rf master-branch/* master-branch/.[!.]* master-branch/..?* || true
          cp -R dist/. master-branch/
          cp master-branch/index.html master-branch/404.html

      - name: Commit and push master
        shell: bash
        run: |
          cd master-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes"
            exit 0
          fi
          git commit -m "chore(deploy): 更新 GitHub Pages 靜態檔"
          git push origin HEAD:master
