name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 設定權限：允許 Action 寫入 GitHub Pages 環境
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同時只有一個部署流程在執行
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 檢出程式碼
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # 設定 Node.js 環境（使用 LTS 版本）
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 安裝依賴
      - name: Install dependencies 🔧
        run: npm ci

      # 建立 .env 檔案（從 Repository Variables 讀取 Firebase 設定）
      - name: Create .env file
        run: |
          cat > .env << EOF
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          EOF

      # 檢查環境變數（調試用）
      - name: Verify environment variables
        run: |
          echo "Firebase 環境變數檢查："
          [ -z "${{ vars.VITE_FIREBASE_API_KEY }}" ] && echo "⚠️ VITE_FIREBASE_API_KEY 未設定" || echo "✓ VITE_FIREBASE_API_KEY 已設定"
          [ -z "${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" ] && echo "⚠️ VITE_FIREBASE_AUTH_DOMAIN 未設定" || echo "✓ VITE_FIREBASE_AUTH_DOMAIN 已設定"
          [ -z "${{ vars.VITE_FIREBASE_PROJECT_ID }}" ] && echo "⚠️ VITE_FIREBASE_PROJECT_ID 未設定" || echo "✓ VITE_FIREBASE_PROJECT_ID 已設定"

      # 建置專案（產生 dist 資料夾）
      - name: Build 🏗️
        run: npm run build

      # 設定 GitHub Pages（建立必要的 metadata）
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 上傳建置結果為 artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 部署工作（必須在 build 完成後執行）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 從 artifact 部署到 GitHub Pages
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
